<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingenium Member Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="../css/member.css" />
</head>
<body>
  <div class="member-shell">
    <div id="memberAuthView"></div>
    <div id="memberPortalView" hidden></div>
  </div>

  <div class="modal" id="submissionModal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="submissionModalTitle">Submit Task</h3>
        <button class="modal-close" data-modal-close="submissionModal" type="button">×</button>
      </div>
      <div class="form-grid">
        <div class="field full-width">
          <label for="submissionNotes">Notes</label>
          <textarea id="submissionNotes" placeholder="Add notes for your submission..."></textarea>
        </div>
        <div class="field full-width">
          <label for="submissionFile">Upload File</label>
          <input id="submissionFile" type="file" />
        </div>
        <div class="field">
          <label for="submissionGithub">GitHub Link</label>
          <input id="submissionGithub" type="url" placeholder="https://github.com/..." />
        </div>
        <div class="field">
          <label for="submissionDrive">Drive Link</label>
          <input id="submissionDrive" type="url" placeholder="https://drive.google.com/..." />
        </div>
      </div>
      <div class="confirm-actions">
        <button class="ghost-btn" data-modal-close="submissionModal" type="button">Cancel</button>
        <button class="primary-btn" id="submitTaskBtn" type="button">Submit</button>
      </div>
    </div>
  </div>

  <div class="modal" id="viewSubmissionModal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Submission Details</h3>
        <button class="modal-close" data-modal-close="viewSubmissionModal" type="button">×</button>
      </div>
      <div id="submissionDetailContent" class="submission-detail-list"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/modal.js"></script>
  <script type="module" src="../js/member-auth.js"></script>
</body>
</html>
